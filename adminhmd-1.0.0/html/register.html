<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="adminHMD authentication page">
  <title>Register | adminHMD</title>

  <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendors/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body class="auth-body">
  <button class="icon-button theme-toggle auth-theme-toggle" type="button" data-theme-toggle
    aria-label="Switch color theme" title="Switch color theme">
    <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
  </button>
  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-brand" href="index.html"><span class="brand-icon"><i class="bi bi-grid-1x2-fill"
            aria-hidden="true"></i></span><span><strong>Administrador de Stock</strong><small>Cree su
            cuenta</small></span></a>

      <form class="needs-validation" novalidate>
        <div class="mb-4">

          <h1 class="h3 mb-1">Registro</h1>

        </div>
        <div class="mb-3">
          <label class="form-label" for="registerName">Nombre</label>
          <input class="form-control" id="registerName" type="text" name="username">
          <div class="invalid-feedback">Full name is required.</div>
        </div>

        <div class="mb-3"><label class="form-label" for="registerPassword">Contraseña</label>
          <input class="form-control" id="registerPassword" type="password" minlength="6" required>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="terms" required><label
            class="form-check-label" for="terms">I agree to the terms</label>
          <div class="invalid-feedback">You must agree before continuing.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit"><i class="bi bi-person-plus" aria-hidden="true"></i> Create
          Account</button>
      </form>

      <div class="auth-footer">Already have an account? <a href="login.html">Sign in</a></div>
    </section>
  </main>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/main.js"></script>
</body>

</html>
